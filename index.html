<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Contract Saver</title></head><body><header><div><small>مساعدك الشخصي للعقود</small><h1>Contract Saver</h1></div><button id="installBtn" hidden>تثبيت</button></header><main><section class="hero"><span>التوفير المحتمل سنوياً</span><strong id="potential">0 €</strong><p id="summary">أضف عقودك لنبدأ المقارنة.</p></section><nav><button class="tab active" data-tab="contracts">عقودي</button><button class="tab" data-tab="offers">المقارنة</button><button class="tab" data-tab="savings">التوفير</button></nav><section id="contracts" class="panel active"><div class="sectionHead"><h2>العقود</h2><button id="addBtn">+ عقد جديد</button></div><div id="contractList"></div></section><section id="offers" class="panel"><h2>مقارنة العروض</h2><p class="muted">هذه النسخة تحسب أي عروض تدخلها يدوياً. البحث الحي في السوق سيضاف في المرحلة التالية.</p><div id="offerArea"></div></section><section id="savings" class="panel"><h2>Savings Tracker</h2><div class="savingBox"><span>التوفير المسجل</span><strong id="saved">0 € / سنة</strong></div><div id="savingList"></div></section></main><dialog id="contractDialog"><form id="contractForm" method="dialog"><h2 id="formTitle">إضافة عقد</h2><input type="hidden" id="editId"><label>نوع العقد<select id="type"><option value="electricity">كهرباء</option><option value="internet">إنترنت</option><option value="mobile">موبايل</option><option value="other">أخرى</option></select></label><label>الشركة<input id="provider" required placeholder="مثال: Vodafone"></label><label>اسم التعرفة<input id="tariff" placeholder="اسم Tarif"></label><label>السعر الشهري €<input id="monthly" type="number" step="0.01" min="0" required></label><label>تاريخ بداية العقد<input id="start" type="date"></label><label>آخر يوم للإلغاء<input id="cancel" type="date"></label><label>نهاية الحد الأدنى للعقد<input id="end" type="date"></label><label>Bonus €<input id="bonus" type="number" step="0.01" min="0" value="0"></label><label>ملاحظات<textarea id="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="closeDialog" class="secondary">إلغاء</button><button type="submit">حفظ</button></div></form></dialog><dialog id="offerDialog"><form id="offerForm" method="dialog"><h2>إضافة عرض للمقارنة</h2><label>العقد<select id="offerContract"></select></label><label>الشركة<input id="offerProvider" required></label><label>السعر الشهري €<input id="offerMonthly" type="number" step="0.01" min="0" required></label><label>Bonus/Cashback €<input id="offerBonus" type="number" step="0.01" min="0" value="0"></label><label>رسوم لمرة واحدة €<input id="offerFee" type="number" step="0.01" min="0" value="0"></label><div class="actions"><button type="button" id="closeOffer" class="secondary">إلغاء</button><button type="submit">قارن</button></div></form></dialog><script src="app.js"></script></body></html>
